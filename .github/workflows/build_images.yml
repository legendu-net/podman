name: Build Podman Images
on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 13 * *'
      timezone: 'America/Los_Angeles'
  push:
    branches:
      - main
      - dev
jobs:
  build_podman_images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/heads/dev
          fetch-depth: 0
      - name: Install Podman
        run: |
          sudo apt update -y
          sudo apt install -y podman
      - name: Login to Quay.io
        uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_TOKEN }}
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sudo env UV_INSTALL_DIR="/usr/local/bin" sh
      #- name: Store Podman Images on /mnt/podman
      #  run: |
      #    uvx --from github_rest_api@latest config_container podman
      - name: Show Podman Images Before Building
        run: podman images
      - name: Build Podman Images
        run: |
          uvx --from github_rest_api@latest build_container_images \
            --file-image-dirs images.md \
            --paths-monitoring images.md .github/workflow/build_images.yml \
            --commit1 "${{ github.event.before }}" \
            --commit2 "${{ github.event.after }}"
      - name: Show Podman Images After Building
        run: podman images
