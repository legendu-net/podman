name: Update the Version of code-server
on:
  schedule:
    - cron: '0 2 * * *'
      timezone: 'America/Los_Angeles'
jobs:
  update-version-code-server:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Update the Version of code-server
        run: |
          uvx --from github_rest_api@latest update_version_containerfile \
            --containerfile vscode-server/Containerfile \
            --repo coder/code-server \
            --pattern '-v v?\d+\.\d+\.\d+' \
            --next_minor_or_strip_patch 3 \
            --replace '-v v{version}' \
            --token ${{ secrets.GITHUBACTIONS }}

